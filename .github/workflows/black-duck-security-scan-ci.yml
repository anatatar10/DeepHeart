name: "Enterprise Security: Black Duck Scan"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  blackduck-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Black Duck Security Scan
        uses: blackduck-inc/black-duck-security-scan@v2.0.0
        with:
          ### FOCUS 1: SCA (Software Composition Analysis)
          # This handles your pom.xml, package.json, and requirements.txt
          blackducksca_url: ${{ vars.BLACKDUCKSCA_URL }}
          blackducksca_token: ${{ secrets.BLACKDUCKSCA_TOKEN }}
          
          ### FOCUS 2: SAST (Static Analysis via Polaris)
          # Polaris is Synopsys's cloud-based SAST engine.
          polaris_server_url: ${{ vars.POLARIS_SERVER_URL }}
          polaris_access_token: ${{ secrets.POLARIS_ACCESS_TOKEN }}
          polaris_assessment_types: "SCA,SAST"

          ### Optional: PR Comments
          # This allows Black Duck to write security findings directly on your Pull Request
          github_token: ${{ secrets.GITHUB_TOKEN }}
